<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UyOffice Info – Công cụ sửa thông tin file Word, PowerPoint, Excel của Uy</title>
    <meta name="description" content="UyOffice Info – Sửa Tác giả, Tiêu đề, Công ty, Ngày tạo... (File > Info) của .docx, .pptx, .xlsx ngay trên trình duyệt." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img class="logo" src="/logo.svg" alt="UyOffice Info" width="44" height="44" />
        <div>
          <h1>UyOffice Info</h1>
          <p>Sửa thông tin <b>File → Info</b> của <span class="tag word">.docx</span> <span class="tag ppt">.pptx</span> <span class="tag excel">.xlsx</span></p>
        </div>
      </div>
      <div class="privacy">🔒 Xử lý 100% trên trình duyệt — file không rời khỏi máy bạn</div>
    </header>

    <main>
      <label id="drop" class="drop">
        <input id="file-input" type="file" multiple accept=".docx,.docm,.dotx,.dotm,.pptx,.pptm,.potx,.potm,.ppsx,.ppsm,.xlsx,.xlsm,.xltx,.xltm" hidden />
        <div class="drop-icon">⬆</div>
        <div class="drop-title">Kéo thả file vào đây hoặc <u>bấm để chọn</u></div>
        <div class="drop-sub">Hỗ trợ nhiều file cùng lúc · Word, PowerPoint, Excel (định dạng Office 2007 trở lên)</div>
      </label>

      <section id="workspace" class="workspace" hidden>
        <aside class="sidebar">
          <div class="side-head">
            <span>File đã chọn</span>
            <button id="btn-clear" class="link">Xóa hết</button>
          </div>
          <ul id="file-list"></ul>
          <button id="btn-download-all" class="btn primary block">⬇ Tải tất cả (.zip)</button>
        </aside>

        <div class="editor">
          <div class="editor-head">
            <div>
              <h2 id="cur-name"></h2>
              <div id="cur-meta" class="muted"></div>
            </div>
            <div class="actions">
              <button id="btn-final" class="btn" title="Đánh dấu bản cuối (Mark as Final) để khi mở bằng Office không bị AutoSave hoặc Ctrl+S ghi đè mất thông tin">🔒 Khóa chỉnh sửa (Mark as Final)</button>
              <button id="btn-personal" class="btn" title="Xóa Tác giả, Người sửa cuối, Công ty, Quản lý, Ngày in">🧹 Xóa thông tin cá nhân</button>
              <button id="btn-apply-all" class="btn" title="Chép các trường đã sửa của file này sang tất cả file khác">⇉ Áp dụng cho tất cả file</button>
              <button id="btn-reset" class="btn">↺ Hoàn tác</button>
              <button id="btn-download-zip" class="btn" title="Đóng gói .zip để giữ nguyên cả Ngày sửa đổi (Date modified) ngoài Windows Explorer khi gửi qua Zalo/Messenger/Drive">📦 Tải .zip (giữ ngày file)</button>
              <button id="btn-download" class="btn primary">⬇ Tải file này</button>
            </div>
          </div>
          <form id="form" autocomplete="off" onsubmit="return false"></form>
        </div>
      </section>
    </main>

    <footer>Phát triển bởi <b>Uy</b> · Mã nguồn trên <a href="https://github.com/wwm100107-creator/office-info-editor" target="_blank" rel="noopener">GitHub</a></footer>
    <div id="toasts"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
