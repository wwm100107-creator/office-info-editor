<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UyOffice Info – Công cụ sửa thông tin file Word, PowerPoint, Excel của Uy</title>
    <meta name="description" content="UyOffice Info – Sửa Tác giả, Tiêu đề, Công ty, Ngày tạo... (File > Info) của .docx, .pptx, .xlsx ngay trên trình duyệt." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="UyOffice Info">
          <path d="M11 9H20V26C20 28.2 21.8 30 24 30C26.2 30 28 28.2 28 26V18H37V26C37 33.2 31.2 39 24 39C16.8 39 11 33.2 11 26V9Z" fill="#0f172a"/>
          <path d="M28 9L37 18H28V9Z" fill="#3b82f6"/>
        </svg>
        <div>
          <h1>UyOffice Info</h1>
          <p>Sửa thông tin <b>File → Info</b> của <span class="tag word">.docx</span> <span class="tag ppt">.pptx</span> <span class="tag excel">.xlsx</span></p>
        </div>
      </div>
      <div class="privacy">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Xử lý 100% trên trình duyệt — file không rời khỏi máy bạn</span>
      </div>
    </header>

    <main>
      <label id="drop" class="drop">
        <input id="file-input" type="file" multiple accept=".docx,.docm,.dotx,.dotm,.pptx,.pptm,.potx,.potm,.ppsx,.ppsm,.xlsx,.xlsm,.xltx,.xltm" hidden />
        <div class="drop-icon">
          <svg class="icon-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-title">Kéo thả file vào đây hoặc <u>bấm để chọn</u></div>
        <div class="drop-sub">Hỗ trợ nhiều file cùng lúc · Word, PowerPoint, Excel (định dạng Office 2007 trở lên)</div>
      </label>

      <section id="workspace" class="workspace" hidden>
        <aside class="sidebar">
          <div class="side-head">
            <span>File đã chọn</span>
            <button id="btn-clear" class="link">Xóa hết</button>
          </div>
          <ul id="file-list"></ul>
          <button id="btn-download-all" class="btn primary block">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Tải tất cả (.zip)</span>
          </button>
        </aside>

        <div class="editor">
          <div class="editor-head">
            <div>
              <h2 id="cur-name"></h2>
              <div id="cur-meta" class="muted"></div>
            </div>
            <div class="actions">
              <button id="btn-final" class="btn" title="Đánh dấu bản cuối (Mark as Final) để khi mở bằng Office không bị AutoSave hoặc Ctrl+S ghi đè mất thông tin">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span id="btn-final-label">Khóa chỉnh sửa (Mark as Final)</span>
              </button>
              <button id="btn-personal" class="btn" title="Xóa Tác giả, Người sửa cuối, Công ty, Quản lý, Ngày in">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
                <span>Xóa thông tin cá nhân</span>
              </button>
              <button id="btn-apply-all" class="btn" title="Chép các trường đã sửa của file này sang tất cả file khác">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                <span>Áp dụng cho tất cả file</span>
              </button>
              <button id="btn-reset" class="btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Hoàn tác</span>
              </button>
              <button id="btn-download-zip" class="btn" title="Đóng gói .zip để giữ nguyên cả Ngày sửa đổi (Date modified) ngoài Windows Explorer khi gửi qua Zalo/Messenger/Drive">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
                <span>Tải .zip (giữ ngày file)</span>
              </button>
              <button id="btn-download" class="btn primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Tải file này</span>
              </button>
            </div>
          </div>
          <form id="form" autocomplete="off" onsubmit="return false"></form>
        </div>
      </section>
    </main>

    <footer>Phát triển bởi <b>Uy</b> · Mã nguồn trên <a href="https://github.com/wwm100107-creator/office-info-editor" target="_blank" rel="noopener">GitHub</a></footer>
    <div id="toasts"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
